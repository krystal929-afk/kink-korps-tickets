<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Anything Goes Play Party Ticket Template</title>
<style type="text/css">
/* Gmail specific styling */
.ReadMsgBody {width: 100%;}
.ExternalClass {width: 100%;}
body, table, td, p, a, li, blockquote {-webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;}
table, td {mso-table-lspace:0pt; mso-table-rspace:0pt;}
img {-ms-interpolation-mode: bicubic;}
/* Structure */
body {margin: 0; padding: 0; min-width: 100%!important; background-color: #000000; font-family: sans-serif;}
.content {width: 100%; max-width: 600px;}
.header {background-color: #000000; padding: 0px;}
.body {background-color: #000000; padding: 20px 20px 40px 20px; color: #ffffff;}
.footer {background-color: #000000; padding: 20px; text-align: center; color: #777777; font-size: 12px;}
/* Components */
.ticket-data {border: 1px solid #7a00ac; padding: 20px; margin-top: 20px; text-align: center; max-width: 400px; margin-left: auto; margin-right: auto;}
.ticket-label {font-weight: bold; color: #e9e9e9; font-size: 14px;}
.ticket-value {color: #ffffff; font-size: 18px;}
</style>
</head>
<body bgcolor="#000000">
<table width="100%" bgcolor="#000000" border="0" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<!-- Main Content Table -->
<table class="content" align="center" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px;">

<!-- Main Hosted Flyer Image Section -->
<tr>
<td class="header" align="center">
<img src="https://krystal929-afk.github.io/kink-korps-tickets/ticket-template.jpeg" width="100%" style="display: block; max-width: 600px; border-bottom: 2px solid #7a00ac;" alt="Kink Korps Presents: Anything Goes Play Party Ticket" />
</td>
</tr>

<!-- Body Section with Editable Data -->
<tr>
<td class="body">
<p style="text-align: center; font-size: 14px; margin-top: 0; margin-bottom: 30px;">Present this ticket (this email) at the door.</p>

<!-- Ticket information section -->
<table class="ticket-data" align="center" cellpadding="0" cellspacing="0" border="0" style="max-width: 400px;">
<tr>
<td class="ticket-label">TICKET NO:</td>
</tr>
<tr>
<td class="ticket-value">[Your unique ticket number here]</td>
</tr>
<tr><td height="10"></td></tr>
<tr>
<td class="ticket-label">ADMIT TO:</td>
</tr>
<tr>
<td class="ticket-value">Anything Goes Play Party</td>
</tr>
<tr><td height="10"></td></tr>
<tr>
<td class="ticket-label">TICKET HOLDER:</td>
</tr>
<tr>
<td class="ticket-value">[Enter Guest Name Here]</td>
</tr>
</table>

</td>
</tr>

<!-- Footer Section -->
<tr>
<td class="footer">
Questions about your ticket? Reply to this email.
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
